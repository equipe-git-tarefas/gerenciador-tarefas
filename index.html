<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas</title>
  <style>
    :root {
      --fundo: #f4f5f7;
      --cartao: #ffffff;
      --texto: #1f2328;
      --texto-suave: #59636e;
      --borda: #d0d7de;
      --primaria: #1f6feb;
      --primaria-hover: #1858c4;
      --erro: #cf222e;
      --sucesso: #1a7f37;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fundo);
      color: var(--texto);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 24px;
      background: var(--cartao);
      border-bottom: 1px solid var(--borda);
    }

    header h1 {
      font-size: 1.2rem;
      margin: 0;
    }

    .cabecalho-direita {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    #status-api {
      font-size: 0.85rem;
      color: var(--texto-suave);
    }

    #status-api.ok {
      color: var(--sucesso);
    }

    #status-api.falha {
      color: var(--erro);
    }

    main {
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 16px;
    }

    .cartao {
      background: var(--cartao);
      border: 1px solid var(--borda);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
    }

    #tela-login {
      max-width: 380px;
      margin: 64px auto;
    }

    #tela-login h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 12px 0 4px;
    }

    input,
    select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--borda);
      border-radius: 6px;
      font-size: 1rem;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: var(--primaria);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background: var(--primaria-hover);
    }

    button.secundario {
      background: transparent;
      color: var(--texto);
      border: 1px solid var(--borda);
    }

    #form-login button {
      width: 100%;
      margin-top: 16px;
    }

    .erro {
      color: var(--erro);
      min-height: 1.2em;
      margin: 8px 0 0;
    }

    [hidden] {
      display: none !important;
    }

    /* Dashboard (issue #6) */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .dashboard-card {
      border: 1px solid var(--borda);
      border-radius: 6px;
      padding: 16px;
      background: var(--fundo);
    }

    .dashboard-card h4 {
      margin: 0 0 12px;
      font-size: 1rem;
      color: var(--texto);
    }

    .metrica-linha {
      margin-bottom: 12px;
    }

    .metrica-cabecalho {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.875rem;
      margin-bottom: 4px;
    }

    .barra-trilho {
      height: 8px;
      background: #e1e4e8;
      border-radius: 4px;
      overflow: hidden;
    }

    .barra-preenchimento {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .barra-a-fazer { background-color: #6e7781; }
    .barra-fazendo { background-color: #1f6feb; }
    .barra-feito { background-color: #1a7f37; }

    .barra-baixa { background-color: #2da44e; }
    .barra-media { background-color: #bf8700; }
    .barra-alta { background-color: #cf222e; }

    .barra-atrasada { background-color: #cf222e; }
    .barra-no-prazo { background-color: #1a7f37; }

    .alerta-atrasada {
      color: var(--erro);
      font-weight: 600;
    }
  </style>
</head>

<body>
  <header>
    <h1>Gerenciador de Tarefas</h1>
    <div class="cabecalho-direita">
      <span id="status-api">API: verificando...</span>
      <button id="botao-sair" class="secundario" hidden>Sair</button>
    </div>
  </header>

  <main>
    <section id="tela-login" class="cartao">
      <h2>Entrar</h2>
      <form id="form-login">
        <label for="usuario">Usuário</label>
        <input id="usuario" name="usuario" autocomplete="username" required>

        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>

        <p id="erro-login" class="erro" role="alert"></p>
        <button type="submit">Entrar</button>
      </form>
    </section>

    <section id="tela-inicial" hidden>
      <div class="cartao">
        <h2>Olá, <span id="nome-usuario"></span></h2>
        <p>Você está autenticado. As funcionalidades de tarefas aparecem abaixo.</p>
      </div>

      <div class="cartao" id="container-formulario-tarefa">
        <h3 id="titulo-formulario">Cadastrar Tarefa</h3>
        <form id="form-tarefa" novalidate>
          <input type="hidden" id="tarefa-id" name="id">

          <label for="tarefa-titulo">Título *</label>
          <input id="tarefa-titulo" name="titulo" required>
          <span id="erro-tarefa-titulo" class="erro" style="display:block; font-size:0.875rem;"></span>

          <label for="tarefa-responsavel">Responsável *</label>
          <input id="tarefa-responsavel" name="responsavel" required>
          <span id="erro-tarefa-responsavel" class="erro" style="display:block; font-size:0.875rem;"></span>

          <label for="tarefa-prioridade">Prioridade *</label>
          <select id="tarefa-prioridade" name="prioridade" required>
            <option value="">Selecione uma prioridade</option>
            <option value="baixa">Baixa</option>
            <option value="media">Média</option>
            <option value="alta">Alta</option>
          </select>
          <span id="erro-tarefa-prioridade" class="erro" style="display:block; font-size:0.875rem;"></span>

          <label for="tarefa-status">Status *</label>
          <select id="tarefa-status" name="status" required>
            <option value="">Selecione um status</option>
            <option value="a_fazer">A Fazer</option>
            <option value="fazendo">Fazendo</option>
            <option value="feito">Feito</option>
          </select>
          <span id="erro-tarefa-status" class="erro" style="display:block; font-size:0.875rem;"></span>

          <label for="tarefa-prazo">Prazo</label>
          <input type="date" id="tarefa-prazo" name="prazo">
          <span id="erro-tarefa-prazo" class="erro" style="display:block; font-size:0.875rem;"></span>

          <p id="erro-tarefa-geral" class="erro" role="alert"></p>

          <div style="margin-top: 16px; display: flex; gap: 8px; align-items: center;">
            <button type="submit" id="btn-salvar-tarefa">Cadastrar tarefa</button>
            <button type="button" id="btn-cancelar-edicao" class="secundario" hidden>Cancelar edição</button>
          </div>
        </form>

        <div id="feedback-tarefa" style="margin-top: 16px; display: flex; align-items: center; gap: 12px;" hidden>
          <span id="mensagem-feedback-tarefa" style="color: var(--sucesso); font-weight: 600;"></span>
          <button type="button" id="btn-editar-esta-tarefa" class="secundario">Editar esta tarefa</button>
        </div>
      </div>

      <div class="cartao" id="container-dashboard">
        <h3>Dashboard</h3>
        <p id="erro-dashboard" class="erro" role="alert"></p>
        <div class="dashboard-grid">
          <div class="dashboard-card">
            <h4>Tarefas por Status</h4>
            <div class="metrica-linha">
              <div class="metrica-cabecalho">
                <span class="metrica-label">A Fazer</span>
                <span id="metrica-status-a-fazer-qtd" class="metrica-qtd">0</span>
              </div>
              <div class="barra-trilho">
                <div id="barra-status-a-fazer" class="barra-preenchimento barra-a-fazer"></div>
              </div>
            </div>
            <div class="metrica-linha">
              <div class="metrica-cabecalho">
                <span class="metrica-label">Fazendo</span>
                <span id="metrica-status-fazendo-qtd" class="metrica-qtd">0</span>
              </div>
              <div class="barra-trilho">
                <div id="barra-status-fazendo" class="barra-preenchimento barra-fazendo"></div>
              </div>
            </div>
            <div class="metrica-linha">
              <div class="metrica-cabecalho">
                <span class="metrica-label">Feito</span>
                <span id="metrica-status-feito-qtd" class="metrica-qtd">0</span>
              </div>
              <div class="barra-trilho">
                <div id="barra-status-feito" class="barra-preenchimento barra-feito"></div>
              </div>
            </div>
          </div>

          <div class="dashboard-card">
            <h4>Tarefas por Prioridade</h4>
            <div class="metrica-linha">
              <div class="metrica-cabecalho">
                <span class="metrica-label">Baixa</span>
                <span id="metrica-prioridade-baixa-qtd" class="metrica-qtd">0</span>
              </div>
              <div class="barra-trilho">
                <div id="barra-prioridade-baixa" class="barra-preenchimento barra-baixa"></div>
              </div>
            </div>
            <div class="metrica-linha">
              <div class="metrica-cabecalho">
                <span class="metrica-label">Média</span>
                <span id="metrica-prioridade-media-qtd" class="metrica-qtd">0</span>
              </div>
              <div class="barra-trilho">
                <div id="barra-prioridade-media" class="barra-preenchimento barra-media"></div>
              </div>
            </div>
            <div class="metrica-linha">
              <div class="metrica-cabecalho">
                <span class="metrica-label">Alta</span>
                <span id="metrica-prioridade-alta-qtd" class="metrica-qtd">0</span>
              </div>
              <div class="barra-trilho">
                <div id="barra-prioridade-alta" class="barra-preenchimento barra-alta"></div>
              </div>
            </div>
          </div>

          <div class="dashboard-card">
            <h4>Prazos de Entrega</h4>
            <div class="metrica-linha">
              <div class="metrica-cabecalho">
                <span class="metrica-label alerta-atrasada">Atrasadas</span>
                <span id="metrica-prazos-atrasadas-qtd" class="metrica-qtd alerta-atrasada">0</span>
              </div>
              <div class="barra-trilho">
                <div id="barra-prazos-atrasadas" class="barra-preenchimento barra-atrasada"></div>
              </div>
            </div>
            <div class="metrica-linha">
              <div class="metrica-cabecalho">
                <span class="metrica-label">No Prazo</span>
                <span id="metrica-prazos-no-prazo-qtd" class="metrica-qtd">0</span>
              </div>
              <div class="barra-trilho">
                <div id="barra-prazos-no-prazo" class="barra-preenchimento barra-no-prazo"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Áreas das próximas issues: #3 tabela, #4 busca, #5 CSV -->
    </section>
  </main>

  <script>
    const CHAVE_TOKEN = 'tarefas_token';
    const CHAVE_USUARIO = 'tarefas_usuario';

    function obterToken() {
      return sessionStorage.getItem(CHAVE_TOKEN);
    }

    // Faz chamadas à API já com o token; reaproveitada pelas próximas issues.
    async function apiFetch(caminho, opcoes) {
      const config = Object.assign({}, opcoes);
      const cabecalhos = Object.assign({
        'Content-Type': 'application/json'
      }, config.headers);

      const token = obterToken();
      if (token) {
        cabecalhos.Authorization = 'Bearer ' + token;
      }
      config.headers = cabecalhos;

      const resposta = await fetch(caminho, config);
      if (resposta.status === 401 && token) {
        sair();
      }
      return resposta;
    }

    function mostrarTelaInicial() {
      document.getElementById('nome-usuario').textContent = sessionStorage.getItem(CHAVE_USUARIO);
      document.getElementById('tela-login').hidden = true;
      document.getElementById('tela-inicial').hidden = false;
      document.getElementById('botao-sair').hidden = false;
      carregarDashboard();
    }

    function mostrarTelaLogin() {
      document.getElementById('tela-inicial').hidden = true;
      document.getElementById('botao-sair').hidden = true;
      document.getElementById('tela-login').hidden = false;
    }

    function sair() {
      sessionStorage.removeItem(CHAVE_TOKEN);
      sessionStorage.removeItem(CHAVE_USUARIO);
      cancelarEdicao();
      document.getElementById('feedback-tarefa').hidden = true;
      ultimaTarefaSalva = null;
      mostrarTelaLogin();
    }

    let ultimaTarefaSalva = null;

    function limparErrosTarefa() {
      document.getElementById('erro-tarefa-titulo').textContent = '';
      document.getElementById('erro-tarefa-responsavel').textContent = '';
      document.getElementById('erro-tarefa-prioridade').textContent = '';
      document.getElementById('erro-tarefa-status').textContent = '';
      document.getElementById('erro-tarefa-prazo').textContent = '';
      document.getElementById('erro-tarefa-geral').textContent = '';
    }

    function exibirErrosTarefa(erros) {
      if (!erros) return;
      if (erros.titulo) {
        document.getElementById('erro-tarefa-titulo').textContent = erros.titulo;
      }
      if (erros.responsavel) {
        document.getElementById('erro-tarefa-responsavel').textContent = erros.responsavel;
      }
      if (erros.prioridade) {
        document.getElementById('erro-tarefa-prioridade').textContent = erros.prioridade;
      }
      if (erros.status) {
        document.getElementById('erro-tarefa-status').textContent = erros.status;
      }
      if (erros.prazo) {
        document.getElementById('erro-tarefa-prazo').textContent = erros.prazo;
      }
    }

    function validarCamposTarefa(titulo, responsavel, prioridade, status, prazo) {
      const erros = {};

      if (!titulo || titulo.trim() === '') {
        erros.titulo = 'Título é obrigatório';
      } else if (titulo.trim().length > 120) {
        erros.titulo = 'Título deve ter no máximo 120 caracteres';
      }

      if (!responsavel || responsavel.trim() === '') {
        erros.responsavel = 'Responsável é obrigatório';
      } else if (responsavel.trim().length > 80) {
        erros.responsavel = 'Responsável deve ter no máximo 80 caracteres';
      }

      const prioridadesValidas = ['baixa', 'media', 'alta'];
      if (!prioridade || !prioridadesValidas.includes(prioridade)) {
        erros.prioridade = 'Prioridade deve ser baixa, media ou alta';
      }

      const statusValidos = ['a_fazer', 'fazendo', 'feito'];
      if (!status || !statusValidos.includes(status)) {
        erros.status = 'Status deve ser a_fazer, fazendo ou feito';
      }

      if (prazo && prazo.trim() !== '') {
        const prazoStr = prazo.trim();
        const formatoValido = /^\d{4}-\d{2}-\d{2}$/.test(prazoStr);
        if (!formatoValido) {
          erros.prazo = 'Prazo deve estar no formato YYYY-MM-DD';
        } else {
          const partes = prazoStr.split('-').map(Number);
          const data = new Date(partes[0], partes[1] - 1, partes[2]);
          if (
            data.getFullYear() !== partes[0] ||
            data.getMonth() !== partes[1] - 1 ||
            data.getDate() !== partes[2]
          ) {
            erros.prazo = 'Prazo deve ser uma data válida';
          }
        }
      }

      return erros;
    }

    function editarTarefa(tarefa) {
      if (!tarefa) return;
      limparErrosTarefa();
      document.getElementById('feedback-tarefa').hidden = true;

      document.getElementById('tarefa-id').value = tarefa.id;
      document.getElementById('tarefa-titulo').value = tarefa.titulo || '';
      document.getElementById('tarefa-responsavel').value = tarefa.responsavel || '';
      document.getElementById('tarefa-prioridade').value = tarefa.prioridade || '';
      document.getElementById('tarefa-status').value = tarefa.status || '';
      document.getElementById('tarefa-prazo').value = tarefa.prazo || '';

      document.getElementById('titulo-formulario').textContent = 'Editar Tarefa';
      document.getElementById('btn-salvar-tarefa').textContent = 'Salvar alterações';
      document.getElementById('btn-cancelar-edicao').hidden = false;
    }

    window.editarTarefa = editarTarefa;

    function cancelarEdicao() {
      document.getElementById('form-tarefa').reset();
      document.getElementById('tarefa-id').value = '';
      document.getElementById('titulo-formulario').textContent = 'Cadastrar Tarefa';
      document.getElementById('btn-salvar-tarefa').textContent = 'Cadastrar tarefa';
      document.getElementById('btn-cancelar-edicao').hidden = true;
      limparErrosTarefa();
    }

    async function salvarTarefa(evento) {
      evento.preventDefault();
      limparErrosTarefa();
      document.getElementById('feedback-tarefa').hidden = true;

      const id = document.getElementById('tarefa-id').value;
      const titulo = document.getElementById('tarefa-titulo').value;
      const responsavel = document.getElementById('tarefa-responsavel').value;
      const prioridade = document.getElementById('tarefa-prioridade').value;
      const status = document.getElementById('tarefa-status').value;
      const prazo = document.getElementById('tarefa-prazo').value;

      const erros = validarCamposTarefa(titulo, responsavel, prioridade, status, prazo);
      if (Object.keys(erros).length > 0) {
        exibirErrosTarefa(erros);
        return;
      }

      const corpo = {
        titulo: titulo.trim(),
        responsavel: responsavel.trim(),
        prioridade,
        status,
        prazo: prazo && prazo.trim() !== '' ? prazo.trim() : null
      };

      const url = id ? `/api/web/records/${encodeURIComponent(id)}` : '/api/web/records';
      const metodo = id ? 'PUT' : 'POST';

      try {
        const resposta = await apiFetch(url, {
          method: metodo,
          body: JSON.stringify(corpo)
        });

        const dados = await resposta.json();

        if (resposta.status === 400) {
          if (dados.erros) {
            exibirErrosTarefa(dados.erros);
          } else if (dados.erro) {
            document.getElementById('erro-tarefa-geral').textContent = dados.erro;
          }
          return;
        }

        if (!resposta.ok) {
          document.getElementById('erro-tarefa-geral').textContent = dados.erro || 'Falha ao processar requisição.';
          return;
        }

        ultimaTarefaSalva = dados;
        cancelarEdicao();

        document.getElementById('mensagem-feedback-tarefa').textContent = `Tarefa #${dados.id} salva`;
        document.getElementById('feedback-tarefa').hidden = false;

        carregarDashboard();

        if (typeof carregarTarefas === 'function') {
          carregarTarefas();
        }
      } catch (falha) {
        document.getElementById('erro-tarefa-geral').textContent = 'Não foi possível conectar à API.';
      }
    }

    // ---------- Dashboard (issue #6) ----------

    function renderizarDashboard(dados) {
      if (!dados) return;

      const status = dados.status || {};
      const prioridade = dados.prioridade || {};
      const prazos = dados.prazos || {};

      const aFazer = Number(status.a_fazer) || 0;
      const fazendo = Number(status.fazendo) || 0;
      const feito = Number(status.feito) || 0;
      const totalStatus = aFazer + fazendo + feito;

      const baixa = Number(prioridade.baixa) || 0;
      const media = Number(prioridade.media) || 0;
      const alta = Number(prioridade.alta) || 0;
      const totalPrioridade = baixa + media + alta;

      const atrasadas = Number(prazos.atrasadas) || 0;
      const noPrazo = Number(prazos.no_prazo) || 0;
      const totalPrazos = atrasadas + noPrazo;

      // Status
      const elStatusAFazerQtd = document.getElementById('metrica-status-a-fazer-qtd');
      if (elStatusAFazerQtd) elStatusAFazerQtd.textContent = aFazer;
      const elStatusFazendoQtd = document.getElementById('metrica-status-fazendo-qtd');
      if (elStatusFazendoQtd) elStatusFazendoQtd.textContent = fazendo;
      const elStatusFeitoQtd = document.getElementById('metrica-status-feito-qtd');
      if (elStatusFeitoQtd) elStatusFeitoQtd.textContent = feito;

      const elBarraStatusAFazer = document.getElementById('barra-status-a-fazer');
      if (elBarraStatusAFazer) {
        elBarraStatusAFazer.style.width = (totalStatus > 0 ? ((aFazer / totalStatus) * 100).toFixed(1) : '0') + '%';
      }
      const elBarraStatusFazendo = document.getElementById('barra-status-fazendo');
      if (elBarraStatusFazendo) {
        elBarraStatusFazendo.style.width = (totalStatus > 0 ? ((fazendo / totalStatus) * 100).toFixed(1) : '0') + '%';
      }
      const elBarraStatusFeito = document.getElementById('barra-status-feito');
      if (elBarraStatusFeito) {
        elBarraStatusFeito.style.width = (totalStatus > 0 ? ((feito / totalStatus) * 100).toFixed(1) : '0') + '%';
      }

      // Prioridade
      const elPrioridadeBaixaQtd = document.getElementById('metrica-prioridade-baixa-qtd');
      if (elPrioridadeBaixaQtd) elPrioridadeBaixaQtd.textContent = baixa;
      const elPrioridadeMediaQtd = document.getElementById('metrica-prioridade-media-qtd');
      if (elPrioridadeMediaQtd) elPrioridadeMediaQtd.textContent = media;
      const elPrioridadeAltaQtd = document.getElementById('metrica-prioridade-alta-qtd');
      if (elPrioridadeAltaQtd) elPrioridadeAltaQtd.textContent = alta;

      const elBarraPrioridadeBaixa = document.getElementById('barra-prioridade-baixa');
      if (elBarraPrioridadeBaixa) {
        elBarraPrioridadeBaixa.style.width = (totalPrioridade > 0 ? ((baixa / totalPrioridade) * 100).toFixed(1) : '0') + '%';
      }
      const elBarraPrioridadeMedia = document.getElementById('barra-prioridade-media');
      if (elBarraPrioridadeMedia) {
        elBarraPrioridadeMedia.style.width = (totalPrioridade > 0 ? ((media / totalPrioridade) * 100).toFixed(1) : '0') + '%';
      }
      const elBarraPrioridadeAlta = document.getElementById('barra-prioridade-alta');
      if (elBarraPrioridadeAlta) {
        elBarraPrioridadeAlta.style.width = (totalPrioridade > 0 ? ((alta / totalPrioridade) * 100).toFixed(1) : '0') + '%';
      }

      // Prazos
      const elPrazosAtrasadasQtd = document.getElementById('metrica-prazos-atrasadas-qtd');
      if (elPrazosAtrasadasQtd) elPrazosAtrasadasQtd.textContent = atrasadas;
      const elPrazosNoPrazoQtd = document.getElementById('metrica-prazos-no-prazo-qtd');
      if (elPrazosNoPrazoQtd) elPrazosNoPrazoQtd.textContent = noPrazo;

      const elBarraPrazosAtrasadas = document.getElementById('barra-prazos-atrasadas');
      if (elBarraPrazosAtrasadas) {
        elBarraPrazosAtrasadas.style.width = (totalPrazos > 0 ? ((atrasadas / totalPrazos) * 100).toFixed(1) : '0') + '%';
      }
      const elBarraPrazosNoPrazo = document.getElementById('barra-prazos-no-prazo');
      if (elBarraPrazosNoPrazo) {
        elBarraPrazosNoPrazo.style.width = (totalPrazos > 0 ? ((noPrazo / totalPrazos) * 100).toFixed(1) : '0') + '%';
      }
    }

    async function carregarDashboard() {
      const erroDashboard = document.getElementById('erro-dashboard');
      if (erroDashboard) {
        erroDashboard.textContent = '';
      }

      try {
        const resposta = await apiFetch('/api/web/dashboard');
        if (!resposta.ok) {
          if (erroDashboard) {
            erroDashboard.textContent = 'Não foi possível carregar as métricas do dashboard.';
          }
          return;
        }

        const dados = await resposta.json();
        renderizarDashboard(dados);
      } catch (falha) {
        if (erroDashboard) {
          erroDashboard.textContent = 'Não foi possível conectar à API.';
        }
      }
    }

    window.carregarDashboard = carregarDashboard;
    window.renderizarDashboard = renderizarDashboard;

    async function entrar(evento) {
      evento.preventDefault();
      const erro = document.getElementById('erro-login');
      erro.textContent = '';

      const usuario = document.getElementById('usuario').value.trim();
      const senha = document.getElementById('senha').value;

      try {
        const resposta = await fetch('/api/web/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            usuario,
            senha
          })
        });
        const dados = await resposta.json();

        if (!resposta.ok) {
          erro.textContent = dados.erro;
          return;
        }

        sessionStorage.setItem(CHAVE_TOKEN, dados.token);
        sessionStorage.setItem(CHAVE_USUARIO, usuario);
        document.getElementById('senha').value = '';
        mostrarTelaInicial();
      } catch (falha) {
        erro.textContent = 'Não foi possível conectar à API.';
      }
    }

    async function verificarApi() {
      const status = document.getElementById('status-api');
      try {
        const resposta = await fetch('/api/web/health');
        if (resposta.ok) {
          status.textContent = 'API: online';
          status.className = 'ok';
        } else {
          status.textContent = 'API: com problema';
          status.className = 'falha';
        }
      } catch (falha) {
        status.textContent = 'API: offline';
        status.className = 'falha';
      }
    }

    document.getElementById('form-login').addEventListener('submit', entrar);
    document.getElementById('botao-sair').addEventListener('click', sair);
    document.getElementById('form-tarefa').addEventListener('submit', salvarTarefa);
    document.getElementById('btn-cancelar-edicao').addEventListener('click', cancelarEdicao);
    document.getElementById('btn-editar-esta-tarefa').addEventListener('click', () => {
      if (ultimaTarefaSalva) {
        editarTarefa(ultimaTarefaSalva);
      }
    });

    verificarApi();
    if (obterToken()) {
      mostrarTelaInicial();
    }
  </script>
</body>

</html>
